# 대회 전용(춘천) 조회 API 서비스 설정 (웹서비스는 railway.toml, 수집 크론은 railway.cron.toml).
# Railway: 별도 서비스 Settings → Config File Path 를 이 파일로 지정하면 적용됨.
# ⚠ feat/#32 대회 전용 — 시연 종료 후 Railway 서비스 삭제 + 이 파일도 chuncheon/ teardown과 함께 제거.
# bare `uvicorn`은 웹서비스(railway.toml)와 동일하게 Railpack venv PATH로 정상 해석됨(fix/#29는 `python` 한정 이슈).
[deploy]
startCommand = "uvicorn chuncheon.api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/chuncheon/get/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
