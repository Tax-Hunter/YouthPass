# 수집 cron 서비스 전용 설정 (웹서비스는 railway.toml 사용).
# Railway: cron 서비스 Settings → Config File Path 를 이 파일로 지정하면 적용됨.
[deploy]
# bare `python`은 런타임 mise shim(httpx 없음)으로 해석되므로 venv 절대경로로 실행한다.
# 의존성은 /app/.venv 에만 설치됨(Railpack). 우회하지 않으면 ModuleNotFoundError. (fix/#29)
startCommand = "/app/.venv/bin/python -m ingest.run load"
cronSchedule = "0 17 */3 * *"        # UTC 17:00 = KST 02:00, 3일마다
restartPolicyType = "NEVER"          # one-shot: 실행 후 종료(다음 실행은 스케줄에), 재시작 안 함
